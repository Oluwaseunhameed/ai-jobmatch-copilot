# Render Blueprint — Web + API + AI + Redis (free tier)
# Apply: https://dashboard.render.com/blueprints → New Blueprint Instance
# Repo: this monorepo, branch main, Blueprint path render.yaml
#
# After first sync, fill sync:false secrets in the Render dashboard
# (DATABASE_URL, Clerk, CORS/APP URLs, S3, AI CORS). Point Clerk
# allowed origins / redirect URLs at the jobmatch-web hostname.
# Vercel Hobby cannot ship new builds of this app (12-function limit),
# so production web runs on Render free.

services:
  - type: keyvalue
    name: jobmatch-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: vercel-and-external

  - type: web
    name: jobmatch-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOCKER_BUILD
        value: "1"
      - key: QUEUE_DRIVER
        value: inline
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /register
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /dashboard
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /onboarding
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "60000"
      - key: ADMIN_EMAILS
        sync: false
      - key: REDIS_URL
        fromService:
          name: jobmatch-redis
          type: keyvalue
          property: connectionString
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: jobmatch-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: JOB_INGEST_ENABLED
        value: "false"
      - key: QUEUE_DRIVER
        value: redis
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: REDIS_URL
        fromService:
          name: jobmatch-redis
          type: keyvalue
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: jobmatch-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: .
    dockerBuildArgs:
      INSTALL_LLM: "1"
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/ai-service/**
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      # Hosted chat model (requires OPENAI_API_KEY in the dashboard).
      - key: LITELLM_MODEL
        value: openai/gpt-4o-mini
      # Hosted embeddings (768-d to match pgvector column). Requires OPENAI_API_KEY.
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
