<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobMatch Autofill</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
        color: #111;
        background: #fafafa;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .lead {
        margin: 0 0 14px;
        color: #666;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #e8e8e8;
        margin-bottom: 12px;
      }
      .status strong {
        display: block;
        font-size: 13px;
      }
      .status span {
        font-size: 12px;
        color: #666;
      }
      .badge {
        flex-shrink: 0;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 700;
        background: #ecfdf5;
        color: #0f766e;
      }
      .badge.off {
        background: #f4f4f5;
        color: #666;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #666;
        margin-bottom: 4px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 10px;
        font: inherit;
      }
      textarea {
        min-height: 72px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      button {
        width: 100%;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #0f766e;
        border: 1px solid #0f766e;
        margin-top: 8px;
      }
      button.linkish {
        background: transparent;
        color: #0f766e;
        border: 0;
        height: auto;
        padding: 8px 0 0;
        font-weight: 600;
        text-decoration: underline;
        font-size: 12px;
      }
      .advanced {
        display: none;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #e8e8e8;
      }
      .advanced.open {
        display: block;
      }
      .ok {
        color: #0f766e;
        margin-top: 8px;
      }
      .err {
        color: #b91c1c;
        margin-top: 8px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>JobMatch Autofill</h1>
    <p class="lead">Fill employer apply forms from your JobMatch profile.</p>

    <div class="status" id="statusCard">
      <div>
        <strong id="statusTitle">Checking…</strong>
        <span id="statusDetail">Loading connection</span>
      </div>
      <div class="badge off" id="statusBadge">…</div>
    </div>

    <div id="disconnected">
      <button id="openConnect" type="button">Connect in JobMatch</button>
      <button class="secondary" id="pasteToggle" type="button">I have a connect code</button>
      <div id="pasteBox" class="hidden" style="margin-top: 10px">
        <label for="token">Connect code</label>
        <textarea id="token" placeholder="Paste the code from JobMatch"></textarea>
        <button id="save" type="button">Save</button>
      </div>
    </div>

    <div id="connectedActions" class="hidden">
      <button class="secondary" id="test" type="button">Test connection</button>
      <button class="secondary" id="openConnectConnected" type="button">Manage in JobMatch</button>
    </div>

    <button class="linkish" id="advancedToggle" type="button">Advanced settings</button>
    <div class="advanced" id="advanced">
      <label for="appUrl">JobMatch website</label>
      <input id="appUrl" placeholder="https://jobmatch-web.onrender.com" />
      <button class="secondary" id="saveAdvanced" type="button">Save settings</button>
    </div>

    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
