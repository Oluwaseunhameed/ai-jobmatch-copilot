name: Job ingest

# Production catalog refresh. Does not purge seed jobs.
# Required secret: DATABASE_URL (production Postgres).
# Optional: Adzuna/USAJobs/Meili/board overrides — see docs/JOB_INGEST_KEYS.md

on:
  schedule:
    # Twice daily UTC (06:00 and 18:00)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ingest mode'
        required: true
        default: include-keyed
        type: choice
        options:
          - public
          - include-keyed
          - keyed
      max:
        description: 'Optional max jobs per provider (empty = provider defaults)'
        required: false
        type: string
        default: ''

concurrency:
  group: job-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGEST_INCLUDE_KEYED: ${{ secrets.INGEST_INCLUDE_KEYED }}
      INGEST_ATS_DEFAULTS: ${{ secrets.INGEST_ATS_DEFAULTS }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      ADZUNA_COUNTRIES: ${{ secrets.ADZUNA_COUNTRIES }}
      ADZUNA_WHAT: ${{ secrets.ADZUNA_WHAT }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
      USAJOBS_KEYWORD: ${{ secrets.USAJOBS_KEYWORD }}
      GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
      LEVER_BOARDS: ${{ secrets.LEVER_BOARDS }}
      ASHBY_BOARDS: ${{ secrets.ASHBY_BOARDS }}
      WORKABLE_BOARDS: ${{ secrets.WORKABLE_BOARDS }}
      MEILI_HOST: ${{ secrets.MEILI_HOST }}
      MEILI_API_KEY: ${{ secrets.MEILI_API_KEY }}
      MEILI_INDEX_JOBS: ${{ secrets.MEILI_INDEX_JOBS }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing secret DATABASE_URL. Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace packages used by ingest
        # `...` includes workspace deps (@jobmatch/types, database, email, …)
        run: pnpm --filter @jobmatch/job-search... build

      - name: Run job ingest
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "${MODE}" ]; then
            MODE="include-keyed"
          fi
          MAX="${{ github.event.inputs.max }}"
          EXTRA=()
          case "${MODE}" in
            public) ;;
            keyed) EXTRA+=(--keyed) ;;
            include-keyed) EXTRA+=(--include-keyed) ;;
            *) echo "Unknown mode: ${MODE}"; exit 1 ;;
          esac
          if [ -n "${MAX}" ]; then
            EXTRA+=(--max "${MAX}")
          fi
          echo "Mode=${MODE} max=${MAX:-<default>}"
          if [ "${#EXTRA[@]}" -eq 0 ]; then
            pnpm jobs:ingest
          else
            pnpm jobs:ingest -- "${EXTRA[@]}"
          fi
